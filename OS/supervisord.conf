[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=ollama serve
autostart=true
autorestart=true

stdout_logfile=/var/log/supervisor/ollama.out.log
stderr_logfile=/var/log/supervisor/ollama.err.log

[program:fastapi]
command=python main.py
autostart=true
autorestart=true

stdout_logfile=/var/log/supervisor/fastapi.out.log
stderr_logfile=/var/log/supervisor/fastapi.err.log